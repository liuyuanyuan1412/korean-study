<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韩语单词学习</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Apple SD Gothic Neo", sans-serif;
    background: #f5f6fa;
    color: #2d3436;
    min-height: 100vh;
    padding: 16px;
  }
  .app { max-width: 640px; margin: 0 auto; }

  /* 顶部标签栏 */
  .tabs {
    display: flex; gap: 8px; margin-bottom: 20px;
    background: #fff; padding: 6px; border-radius: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .tab {
    flex: 1; padding: 10px; text-align: center; border-radius: 10px;
    cursor: pointer; font-size: 15px; font-weight: 500;
    color: #636e72; transition: all .2s; user-select: none;
  }
  .tab.active { background: #6c5ce7; color: #fff; }

  .page { display: none; }
  .page.active { display: block; }

  /* 卡片 */
  .card {
    background: #fff; border-radius: 20px; padding: 36px 28px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.07);
    text-align: center; min-height: 320px;
    display: flex; flex-direction: column; justify-content: center;
    cursor: pointer; transition: transform .15s;
  }
  .card:active { transform: scale(0.99); }
  .word {
    font-size: 42px; font-weight: 700; color: #6c5ce7;
    margin-bottom: 8px; line-height: 1.3;
  }
  .hint { font-size: 14px; color: #b2bec3; margin-top: 12px; }
  .meaning {
    font-size: 26px; font-weight: 600; margin: 16px 0 20px;
  }
  .section-label {
    font-size: 13px; color: #b2bec3; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 6px; font-weight: 600;
  }
  .colloc {
    font-size: 16px; color: #00b894; margin-bottom: 18px;
    line-height: 1.7; white-space: pre-line;
  }
  .example {
    font-size: 17px; color: #2d3436; line-height: 1.8;
    background: #f8f9fd; padding: 16px; border-radius: 12px;
    text-align: left;
  }
  .hidden { display: none; }

  /* 按钮 */
  .btn-row { display: flex; gap: 12px; margin-top: 20px; }
  .btn {
    flex: 1; padding: 15px; border: none; border-radius: 14px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: all .15s; font-family: inherit;
  }
  .btn:active { transform: scale(0.97); }
  .btn-know { background: #00b894; color: #fff; }
  .btn-unknown { background: #ffeaa7; color: #6c5ce7; }
  .btn-speak {
    background: #6c5ce7; color: #fff; border-radius: 50%;
    width: 56px; height: 56px; font-size: 24px;
    margin: 0 auto; display: flex; align-items: center;
    justify-content: center; flex: none;
  }

  /* 进度条 */
  .progress-wrap {
    background: #fff; border-radius: 14px; padding: 18px;
    margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }
  .progress-bar {
    height: 10px; background: #eee; border-radius: 5px;
    overflow: hidden; margin-top: 10px;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg,#6c5ce7,#a29bfe);
    border-radius: 5px; transition: width .3s;
  }

  /* 统计 */
  .stats { display: flex; gap: 12px; margin-bottom: 16px; }
  .stat {
    flex: 1; background: #fff; border-radius: 14px; padding: 18px;
    text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }
  .stat-num { font-size: 30px; font-weight: 700; color: #6c5ce7; }
  .stat-label { font-size: 13px; color: #636e72; margin-top: 4px; }

  /* 测试 */
  .quiz-question {
    font-size: 38px; font-weight: 700; color: #6c5ce7;
    text-align: center; margin-bottom: 8px;
  }
  .quiz-sub { text-align: center; font-size: 14px; color: #b2bec3; margin-bottom: 24px; }
  .option {
    background: #fff; border: 2px solid #eee; border-radius: 14px;
    padding: 16px; margin-bottom: 10px; cursor: pointer;
    font-size: 17px; transition: all .15s; text-align: center;
  }
  .option:hover { border-color: #a29bfe; }
  .option.correct { background: #d4f8e8; border-color: #00b894; color: #00875a; }
  .option.wrong { background: #ffe0e0; border-color: #ff7675; color: #c0392b; }
  .option.disabled { pointer-events: none; }

  /* 词库列表 */
  .list-item {
    background: #fff; border-radius: 12px; padding: 16px;
    margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .list-word { font-size: 20px; font-weight: 700; color: #6c5ce7; }
  .list-meaning { font-size: 15px; margin: 4px 0 8px; }
  .list-example { font-size: 14px; color: #636e72; line-height: 1.6; }
  .search {
    width: 100%; padding: 14px; border: 2px solid #eee;
    border-radius: 12px; font-size: 16px; margin-bottom: 16px;
    font-family: inherit;
  }
  .search:focus { outline: none; border-color: #a29bfe; }

  .empty { text-align: center; color: #b2bec3; padding: 40px; font-size: 15px; }
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 8px;
    border-radius: 8px; margin-left: 8px; vertical-align: middle;
  }
  .badge-mastered { background: #d4f8e8; color: #00875a; }
  .badge-learning { background: #fff3cd; color: #856404; }
</style>
</head>
<body>
<div class="app">

  <div class="tabs">
    <div class="tab active" data-page="study">学习</div>
    <div class="tab" data-page="quiz">测试</div>
    <div class="tab" data-page="progress">进度</div>
    <div class="tab" data-page="list">词库</div>
  </div>

  <!-- 学习页 -->
  <div class="page active" id="page-study">
    <div class="progress-wrap">
      <div style="display:flex;justify-content:space-between;font-size:14px;color:#636e72;">
        <span>今日学习</span><span id="today-count">0 / 26</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="today-fill" style="width:0%"></div></div>
    </div>

    <div class="card" id="card" onclick="flipCard()">
      <div id="card-front">
        <div class="word" id="word-front">—</div>
        <button class="btn btn-speak" style="margin-top:20px;" onclick="event.stopPropagation();speakCurrent()">🔊</button>
        <div class="hint">点击卡片查看释义</div>
      </div>
      <div id="card-back" class="hidden">
        <div class="word" style="font-size:32px;" id="word-back">—</div>
        <div class="meaning" id="meaning-back">—</div>
        <div class="section-label">常用搭配</div>
        <div class="colloc" id="colloc-back">—</div>
        <div class="section-label" style="text-align:left;">例句</div>
        <div class="example" id="example-back">—</div>
      </div>
    </div>

    <div class="btn-row" id="btn-row">
      <button class="btn btn-unknown" onclick="markWord(false)">不认识</button>
      <button class="btn btn-know" onclick="markWord(true)">认识</button>
    </div>
  </div>

  <!-- 测试页 -->
  <div class="page" id="page-quiz">
    <div id="quiz-area">
      <div class="quiz-question" id="quiz-q">—</div>
      <div class="quiz-sub">选出正确的中文意思</div>
      <div id="quiz-options"></div>
      <div style="text-align:center;margin-top:20px;font-size:14px;color:#636e72;">
        得分：<span id="quiz-score">0</span> / <span id="quiz-total">0</span>
      </div>
    </div>
    <div id="quiz-empty" class="empty hidden">
      还没有学过的单词，先去「学习」页学几个吧 📚
    </div>
  </div>

  <!-- 进度页 -->
  <div class="page" id="page-progress">
    <div class="stats">
      <div class="stat"><div class="stat-num" id="stat-total">0</div><div class="stat-label">总词数</div></div>
      <div class="stat"><div class="stat-num" id="stat-mastered">0</div><div class="stat-label">已掌握</div></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-num" id="stat-learning">0</div><div class="stat-label">学习中</div></div>
      <div class="stat"><div class="stat-num" id="stat-today">0</div><div class="stat-label">今日学习</div></div>
    </div>
    <div class="progress-wrap">
      <div style="font-size:14px;color:#636e72;margin-bottom:4px;">总体掌握进度</div>
      <div class="progress-bar" style="height:14px;">
        <div class="progress-fill" id="master-fill" style="width:0%"></div>
      </div>
      <div style="font-size:13px;color:#b2bec3;margin-top:8px;" id="master-text">0%</div>
    </div>
    <button class="btn" style="background:#ffeaea;color:#e74c3c;width:100%;" onclick="resetProgress()">重置所有进度</button>
  </div>

  <!-- 词库页 -->
  <div class="page" id="page-list">
    <input class="search" id="search" placeholder="搜索韩语或中文..." oninput="renderList()">
    <div id="list-container"></div>
  </div>

</div>

<script>
// ============ 单词数据 ============
const WORDS = [
  { kr:"어획량", cn:"捕捞量", colloc:"어획량이 급감하다 / 어획량 감소", ex:"국내 오징어 어획량은 2024년 약 1만 3천 톤으로 급감했습니다." },
  { kr:"급감하다", cn:"骤减、暴跌", colloc:"어획량이 급감하다 / 급감하며", ex:"15만 5천 톤에서 1만 3천 톤으로 급감하며 10분의 1 수준으로 줄어들었습니다." },
  { kr:"줄어들다", cn:"减少、缩减", colloc:"물량이 줄어들다 / 수준으로 줄어들다", ex:"시장에 공급되는 물량이 줄어든 겁니다." },
  { kr:"수온", cn:"水温", colloc:"수온이 상승하다 / 따뜻한 수온", ex:"주요 원인으로는 바다의 수온 상승이 꼽히는데요." },
  { kr:"상승", cn:"上升", colloc:"수온 상승 / 가격 상승", ex:"온실가스 배출 등으로 바닷물 온도가 점차 오르고 있습니다." },
  { kr:"꼽히다", cn:"被列举、被认为", colloc:"원인으로 꼽히다 / 대표작으로 꼽히다", ex:"주요 원인으로는 바다의 수온 상승이 꼽히는데요." },
  { kr:"포식성", cn:"肉食性的", colloc:"포식성 어류", ex:"따뜻한 수온을 선호하는 포식성 어류인 방어가 활동 영역을 넓혔습니다." },
  { kr:"활동 영역", cn:"活动范围", colloc:"활동 영역을 넓히다", ex:"방어가 활동 영역을 넓히고 있습니다." },
  { kr:"넓히다", cn:"扩大、拓宽", colloc:"영역을 넓히다 / 폭을 넓히다", ex:"방어가 활동 영역을 넓히면서 조업이 어려워졌습니다." },
  { kr:"조업", cn:"捕鱼作业", colloc:"조업 여건 / 조업이 어려워지다", ex:"어선 기름값 부담까지 더해지면서 조업 여건이 나빠졌습니다." },
  { kr:"여건", cn:"条件、环境", colloc:"조업 여건 / 근무 여건", ex:"조업 여건이 나빠진 것 등이 영향을 준다는 분석이 나옵니다." },
  { kr:"기름값", cn:"油价、燃油费", colloc:"기름값 부담 / 기름값이 오르다", ex:"어선 기름값 부담까지 더해지면서 조업 여건이 나빠졌습니다." },
  { kr:"더해지다", cn:"加上、叠加", colloc:"부담이 더해지다 / ~에 더해져", ex:"어선 기름값 부담까지 더해지면서 조업 여건이 나빠졌습니다." },
  { kr:"수급", cn:"供需", colloc:"수급과 가격 / 수급이 불안하다", ex:"오징어 수급과 가격이 언제 안정될지는 단정하기 어렵습니다." },
  { kr:"단정하다", cn:"断定、妄下定论", colloc:"단정하기 어렵다 / 단정할 수 없다", ex:"오징어 수급과 가격이 언제 안정될지는 단정하기 어렵다는 목소리가 나옵니다." },
  { kr:"안정되다", cn:"稳定", colloc:"가격이 안정되다 / 수급이 안정되다", ex:"그렇다면 오징어 가격은 언제쯤 안정될 수 있을까요?" },
  { kr:"물량", cn:"货量、数量", colloc:"공급 물량 / 물량이 줄다", ex:"시장에 공급되는 물량이 줄어든 겁니다." },
  { kr:"부담", cn:"负担", colloc:"가격 부담 / 부담을 느끼다", ex:"실제로 횟집이나 마트에서 느끼는 가격 부담은 더 크다는 목소리도 나오는데요." },
  { kr:"해양환경", cn:"海洋环境", colloc:"해양환경 변화 / 해양환경을 보호하다", ex:"기후변화에 따른 해양환경 변화가 이어지고 있습니다." },
  { kr:"온실가스", cn:"温室气体", colloc:"온실가스 배출 / 온실가스를 줄이다", ex:"온실가스 배출 등으로 바닷물 온도가 점차 오르고 있습니다." },
  { kr:"배출", cn:"排放", colloc:"온실가스 배출 / 배출량을 줄이다", ex:"온실가스 배출 등으로 바닷물 온도가 점차 올랐습니다." },
  { kr:"이동 경로", cn:"移动路线", colloc:"이동 경로에 변화가 생기다", ex:"오징어가 머무는 곳이나 이동 경로에 변화가 생겼습니다." },
  { kr:"머무르다", cn:"停留、栖息", colloc:"머무는 곳 / 오래 머무르다", ex:"오징어가 머무는 곳이나 이동 경로에 변화가 생겼습니다." },
  { kr:"등장하다", cn:"出现、登场", colloc:"표현이 등장하다 / 새 모델이 등장하다", ex:"그래서 '금징어'라는 표현까지 등장했습니다." },
  { kr:"금징어", cn:'"金鱿鱼"（금+오징어 新造词）', colloc:"'금징어'라는 표현", ex:"그래서 '금징어'라는 표현까지 등장했습니다." },
  { kr:"수산물", cn:"水产品", colloc:"수산물 가격 / 수산물 시장", ex:"이제는 가격표부터 확인하게 되는 수산물이 됐습니다." },
  { kr:"냉장", cn:"冷藏", colloc:"냉장 오징어 / 냉장 보관", ex:"지난 8월 말 기준 큰 냉장 오징어 한 마리 가격은 5,210원입니다." },
  { kr:"가량", cn:"大约、左右", colloc:"15%가량 / 한 달 가량", ex:"5,210원으로 1년 전보다 15%가량 올랐습니다." }
];

// ============ 状态管理 ============
const STORAGE_KEY = 'korean_learning_progress';

function loadState() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try { return JSON.parse(raw); } catch(e) {}
  }
  return { progress: {}, todayDate: todayStr(), todayCount: 0, order: [] };
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function todayStr() {
  return new Date().toISOString().slice(0,10);
}

let state = loadState();

// 跨天重置今日计数
if (state.todayDate !== todayStr()) {
  state.todayDate = todayStr();
  state.todayCount = 0;
  saveState();
}

// ============ 学习页 ============
let currentIndex = 0;
let isFlipped = false;

function getStudyOrder() {
  // 未掌握的优先，已掌握的排后面；同组内保持原顺序
  const idxs = WORDS.map((_, i) => i);
  idxs.sort((a, b) => {
    const pa = state.progress[a] || 0;
    const pb = state.progress[b] || 0;
    if (pa >= 3 && pb < 3) return 1;
    if (pa < 3 && pb >= 3) return -1;
    return a - b;
  });
  return idxs;
}

let studyOrder = getStudyOrder();

function renderCard() {
  if (studyOrder.length === 0) return;
  const idx = studyOrder[currentIndex % studyOrder.length];
  const w = WORDS[idx];
  document.getElementById('word-front').textContent = w.kr;
  document.getElementById('word-back').textContent = w.kr;
  document.getElementById('meaning-back').textContent = w.cn;
  document.getElementById('colloc-back').textContent = w.colloc;
  document.getElementById('example-back').textContent = w.ex;
  document.getElementById('card-front').classList.remove('hidden');
  document.getElementById('card-back').classList.add('hidden');
  isFlipped = false;
  updateTodayProgress();
}

function flipCard() {
  if (isFlipped) return;
  document.getElementById('card-front').classList.add('hidden');
  document.getElementById('card-back').classList.remove('hidden');
  isFlipped = true;
}

function speakCurrent() {
  const idx = studyOrder[currentIndex % studyOrder.length];
  speak(WORDS[idx].kr);
}

function speak(text) {
  if (!('speechSynthesis' in window)) {
    alert('你的浏览器不支持语音功能');
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR';
  u.rate = 0.9;
  // 优先选韩语语音
  const voices = speechSynthesis.getVoices();
  const koVoice = voices.find(v => v.lang.startsWith('ko'));
  if (koVoice) u.voice = koVoice;
  speechSynthesis.speak(u);
}

function markWord(known) {
  const idx = studyOrder[currentIndex % studyOrder.length];
  const cur = state.progress[idx] || 0;
  state.progress[idx] = known ? Math.min(cur + 1, 5) : 0;
  state.todayCount++;
  state.todayDate = todayStr();
  saveState();

  currentIndex++;
  // 重新排序：刚掌握的往后排
  if (currentIndex >= studyOrder.length) {
    studyOrder = getStudyOrder();
    currentIndex = 0;
  }
  renderCard();
}

function updateTodayProgress() {
  const total = WORDS.length;
  const count = state.todayCount;
  document.getElementById('today-count').textContent = `${count} / ${total}`;
  document.getElementById('today-fill').style.width = Math.min(count/total*100, 100) + '%';
}

// ============ 测试页 ============
let quizScore = 0, quizTotal = 0, quizAnswered = false;

function startQuiz() {
  const learned = WORDS.map((_, i) => i).filter(i => (state.progress[i] || 0) > 0);
  if (learned.length < 4) {
    document.getElementById('quiz-area').classList.add('hidden');
    document.getElementById('quiz-empty').classList.remove('hidden');
    return;
  }
  document.getElementById('quiz-area').classList.remove('hidden');
  document.getElementById('quiz-empty').classList.add('hidden');
  nextQuestion();
}

function nextQuestion() {
  quizAnswered = false;
  const learned = WORDS.map((_, i) => i).filter(i => (state.progress[i] || 0) > 0);
  const correctIdx = learned[Math.floor(Math.random() * learned.length)];

  // 生成 3 个干扰项
  const others = WORDS.map((_, i) => i).filter(i => i !== correctIdx);
  const distractors = [];
  while (distractors.length < 3 && others.length > 0) {
    const pick = others.splice(Math.floor(Math.random() * others.length), 1)[0];
    distractors.push(pick);
  }

  const options = [correctIdx, ...distractors].sort(() => Math.random() - 0.5);

  document.getElementById('quiz-q').textContent = WORDS[correctIdx].kr;
  const optBox = document.getElementById('quiz-options');
  optBox.innerHTML = '';
  options.forEach(i => {
    const div = document.createElement('div');
    div.className = 'option';
    div.textContent = WORDS[i].cn;
    div.onclick = () => answerQuiz(div, i === correctIdx, correctIdx);
    optBox.appendChild(div);
  });
  quizTotal++;
  document.getElementById('quiz-total').textContent = quizTotal;
}

function answerQuiz(el, correct, correctIdx) {
  if (quizAnswered) return;
  quizAnswered = true;
  document.querySelectorAll('.option').forEach(o => o.classList.add('disabled'));
  if (correct) {
    el.classList.add('correct');
    quizScore++;
    document.getElementById('quiz-score').textContent = quizScore;
    // 答对加分
    state.progress[correctIdx] = Math.min((state.progress[correctIdx] || 0) + 1, 5);
    saveState();
  } else {
    el.classList.add('wrong');
    // 标出正确答案
    document.querySelectorAll('.option').forEach(o => {
      if (o.textContent === WORDS[correctIdx].cn) o.classList.add('correct');
    });
  }
  speak(WORDS[correctIdx].kr);
  setTimeout(nextQuestion, 1400);
}

// ============ 进度页 ============
function renderProgress() {
  const total = WORDS.length;
  let mastered = 0, learning = 0;
  WORDS.forEach((_, i) => {
    const p = state.progress[i] || 0;
    if (p >= 3) mastered++;
    else if (p > 0) learning++;
  });
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-mastered').textContent = mastered;
  document.getElementById('stat-learning').textContent = learning;
  document.getElementById('stat-today').textContent = state.todayCount;
  const pct = total ? Math.round(mastered / total * 100) : 0;
  document.getElementById('master-fill').style.width = pct + '%';
  document.getElementById('master-text').textContent = `${mastered} / ${total} 已掌握（${pct}%）`;
}

function resetProgress() {
  if (!confirm('确定要重置所有学习进度吗？此操作不可恢复。')) return;
  state = { progress: {}, todayDate: todayStr(), todayCount: 0, order: [] };
  saveState();
  currentIndex = 0;
  studyOrder = getStudyOrder();
  renderCard();
  renderProgress();
  renderList();
  alert('已重置');
}

// ============ 词库页 ============
function renderList() {
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  const box = document.getElementById('list-container');
  box.innerHTML = '';
  WORDS.forEach((w, i) => {
    if (q && !w.kr.toLowerCase().includes(q) && !w.cn.toLowerCase().includes(q)) return;
    const p = state.progress[i] || 0;
    let badge = '';
    if (p >= 3) badge = '<span class="badge badge-mastered">已掌握</span>';
    else if (p > 0) badge = '<span class="badge badge-learning">学习中</span>';
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = `
      <div class="list-word">${w.kr}${badge}
        <button class="btn btn-speak" style="width:36px;height:36px;font-size:16px;display:inline-flex;margin-left:8px;vertical-align:middle;" onclick="speak('${w.kr.replace(/'/g,"\\'")}')">🔊</button>
      </div>
      <div class="list-meaning">${w.cn}</div>
      <div class="list-example"><b>搭配：</b>${w.colloc}<br><b>例句：</b>${w.ex}</div>
    `;
    box.appendChild(div);
  });
  if (box.children.length === 0) {
    box.innerHTML = '<div class="empty">没有找到匹配的单词</div>';
  }
}

// ============ 标签切换 ============
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('page-' + tab.dataset.page).classList.add('active');
    if (tab.dataset.page === 'progress') renderProgress();
    if (tab.dataset.page === 'list') renderList();
    if (tab.dataset.page === 'quiz') startQuiz();
  };
});

// ============ 初始化 ============
window.addEventListener('load', () => {
  renderCard();
  renderProgress();
  // 预加载语音列表
  if ('speechSynthesis' in window) {
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }
});

// 键盘快捷键：空格翻卡，1不认识 2认识
document.addEventListener('keydown', e => {
  if (!document.getElementById('page-study').classList.contains('active')) return;
  if (e.code === 'Space') { e.preventDefault(); flipCard(); }
  if (e.key === '1') markWord(false);
  if (e.key === '2') markWord(true);
});
</script>
</body>
